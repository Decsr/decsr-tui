version: 2

project_name: decsr-tui

builds:
  - id: decsr-tui
    main: ./cmd/decsr-tui
    binary: decsr-tui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: decsr-tui
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Homebrew is disabled for now: the Decsr/homebrew-tap repository and its
# token do not exist yet, and a missing tap would fail the whole release. To
# enable it, create the tap, add HOMEBREW_TAP_GITHUB_TOKEN as a repository
# secret and restore the block (and the env line in release.yml).
#
# homebrew_casks:
#   - name: decsr-tui
#     ids: [decsr-tui]
#     binaries: [decsr-tui]
#     homepage: https://github.com/Decsr/decsr-tui
#     description: Git client that also watches coding-agent sessions read-only
#     repository:
#       owner: Decsr
#       name: homebrew-tap
#       token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
#     hooks:
#       post:
#         install_steps: |
#           on_macos do
#             run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/decsr-tui"]
#           end

# The release workflow passes this version's CHANGELOG.md section with
# --release-notes. This block is the fallback (commit list) for a local run.
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'
      - '^test:'

release:
  header: |
    ## decsr-tui {{ .Tag }}

    A git client and a live coding-agent watcher in one terminal UI.
  footer: |
    ## Install

    Ubuntu: `curl -fsSL https://raw.githubusercontent.com/Decsr/decsr-tui/main/scripts/install.sh | sh`

    Windows (PowerShell): `irm https://raw.githubusercontent.com/Decsr/decsr-tui/main/scripts/install.ps1 | iex`

    Or `go install github.com/Decsr/decsr-tui/cmd/decsr-tui@{{ .Tag }}`. The
    archives are checked against `checksums.txt`. See the
    [README](https://github.com/Decsr/decsr-tui#readme) for the keys and config.
